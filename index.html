


    <!DOCTYPE html>
<html>
<head>
    <title>Cricket Division Pro</title>
    <style>
        body { font-family: sans-serif; background: #222; color: white; text-align: center; margin: 0; padding: 20px; }
        #game-box { max-width: 500px; margin: auto; background: #333; padding: 20px; border-radius: 15px; border: 2px solid #444; }
        .tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .tile { height: 80px; background: #28a745; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 8px; }
        .tile:active { background: #1e7e34; }
        .hidden { display: none; }
        .stats { background: #444; padding: 10px; margin-bottom: 10px; border-radius: 5px; font-size: 0.9em; }
        input, select, button { padding: 10px; margin: 10px; border-radius: 5px; border: none; width: 80%; }
        button { background: #007bff; color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-box">
    <!-- Screen 1: Setup -->
    <div id="setup-screen">
        <h1>🏏 Cricket Career</h1>
        <input type="text" id="pName" placeholder="Your Name">
        <select id="pRole">
            <option value="Batsman">Batsman</option>
            <option value="All-Rounder">All-Rounder</option>
            <option value="Bowler">Bowler</option>
        </select>
        <button onclick="initGame()">Start Career</button>
    </div>

    <!-- Screen 2: Match UI -->
    <div id="match-screen" class="hidden">
        <div class="stats">
            <span id="stat-name"></span> | Div: <span id="stat-div">3</span><br>
            Season Runs: <span id="stat-runs">0</span> | Wickets: <span id="stat-wicks">0</span>
        </div>
        <h3 id="match-status">Toss Phase</h3>
        <div id="score-board" style="font-size: 1.5em; color: #ffc107;">0 - 0 (0.0)</div>
        
        <div class="tile-grid" id="tiles">
            <div class="tile" onclick="playBall()">?</div>
            <div class="tile" onclick="playBall()">?</div>
            <div class="tile" onclick="playBall()">?</div>
            <div class="tile" onclick="playBall()">?</div>
        </div>
        <div id="event-log" style="font-style: italic; color: #aaa;">Click a tile to play</div>
    </div>
</div>

<script>
    // Game State
    let player = { name: "", role: "", div: 3, seasonRuns: 0, seasonWicks: 0, matches: 0 };
    let match = { runs: 0, wickets: 0, balls: 0, target: 0 };

    function initGame() {
        player.name = document.getElementById('pName').value || "Player";
        player.role = document.getElementById('pRole').value;
        
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('match-screen').classList.remove('hidden');
        document.getElementById('stat-name').innerText = player.name;
        
        console.log("Game Started for:", player.name);
        startNewMatch();
    }

    function startNewMatch() {
        match.runs = 0; match.wickets = 0; match.balls = 0;
        document.getElementById('match-status').innerText = "Match " + (player.matches + 1) + " of 10";
        updateDisplay();
    }

    function playBall() {
        let rng = Math.random();
        let log = "";
        
        if (rng < 0.20) { // 20% Chance of Out
            log = "OUT! Dismissed!";
            endMatch();
        } else {
            let runs = [1, 2, 3, 4, 6][Math.floor(Math.random() * 5)];
            match.runs += runs;
            player.seasonRuns += runs;
            match.balls++;
            log = "You scored " + runs + "!";
        }

        if (match.balls >= 120) endMatch(); // End after 20 overs
        
        document.getElementById('event-log').innerText = log;
        updateDisplay();
    }

    function updateDisplay() {
        let overs = Math.floor(match.balls / 6) + "." + (match.balls % 6);
        document.getElementById('score-board').innerText = match.runs + " / " + match.wickets + " (" + overs + ")";
        document.getElementById('stat-runs').innerText = player.seasonRuns;
        document.getElementById('stat-div').innerText = player.div;
    }

    function endMatch() {
        player.matches++;
        alert("Innings Over! Match Finished.");
        
        if (player.matches >= 10) {
            checkSeasonEnd();
        } else {
            startNewMatch();
        }
    }

    function checkSeasonEnd() {
        let success = false;
        if (player.role === "Batsman" && player.seasonRuns >= 300) success = true;
        // ... (other logic)

        if (success && player.div > 1) {
            player.div--;
            alert("PROMOTED! Welcome to Division " + player.div);
        } else {
            alert("Season finished. You stay in Division " + player.div);
        }
        
        // Reset for next division
        player.matches = 0; player.seasonRuns = 0; player.seasonWicks = 0;
        startNewMatch();
    }
</script>

</body>
</html>
